# Publishes the tag it runs on to npm. Release tags come from release-please:
# merging its release PR creates the tag and the GitHub Release, then
# release-please.yml dispatches this workflow on the tag. Pre-release tags
# (-beta.N, -rc.N, -alpha.N) are pushed by hand, and only a pushed tag gets
# its GitHub Release created here.
name: 'Release on tag'

on:
  push:
    tags:
      - 'v*'
  # How release-please.yml starts this on a tag it created: that tag, pushed
  # with GITHUB_TOKEN, raises no push event.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A dispatched run is on a tag release-please made, and release-please made
  # its Release too; creating one here would be a second for the same tag.
  release:
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release
    # Runs after the Release on a pushed tag, and without it on a dispatched
    # one, where that job is skipped. A dispatch can name any ref; only a
    # release tag is published.
    if: ${{ !cancelled() && needs.release.result != 'failure' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
          echo "tag and package.json agree on $PKG"

      - name: Publish to npm
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [[ "$tag" == *alpha* ]]; then
            npm publish --provenance --access public --tag alpha
          elif [[ "$tag" == *beta* ]]; then
            npm publish --provenance --access public --tag beta
          elif [[ "$tag" == *rc* ]]; then
            npm publish --provenance --access public --tag rc
          else
            npm publish --provenance --access public
          fi
