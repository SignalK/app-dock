<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <!-- Transparent background: the artwork is drawn straight on the canvas in
       mid-tone colours that read on light and dark pages alike -->
  <!-- Compass rose -->
  <circle cx="36" cy="16" r="11" fill="none" stroke="#3b82f6" stroke-opacity="0.7" stroke-width="1.5"/>
  <line x1="36" y1="3" x2="36" y2="7" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="23" y1="16" x2="27" y2="16" stroke="#3b82f6" stroke-opacity="0.7" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="45" y1="16" x2="49" y2="16" stroke="#3b82f6" stroke-opacity="0.7" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="36,8 33,16 36,14 39,16" fill="#ef4444"/>
  <polygon points="36,24 33,16 36,18 39,16" fill="#64748b"/>
  <!-- Dock pill -->
  <rect x="3" y="44" width="66" height="22" rx="11" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- Dock icons - 3 squares in the pill -->
  <rect x="9" y="49" width="12" height="12" rx="3" fill="#3b82f6"/>
  <rect x="30" y="49" width="12" height="12" rx="3" fill="#10b981"/>
  <rect x="51" y="49" width="12" height="12" rx="3" fill="#f59e0b"/>
  <!-- Middle icon magnified (popping up) -->
  <rect x="27" y="29" width="18" height="18" rx="4.5" fill="#10b981"/>
  <!-- Active dot under middle icon -->
  <circle cx="36" cy="69.5" r="2" fill="#3b82f6"/>
</svg>
